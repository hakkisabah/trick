[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trick"
version = "0.2.0"
description = "Trick: scored retrieval for scientific and engineering sources, powered by laya"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
accel = ["numpy>=1.24"]
dev = ["pytest>=8", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "accel: requires the optional numpy accelerator",
]
